<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradientBg)" stroke="url(#gradientStroke)" stroke-width="2"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ee7d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5eb3ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gradientStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ee7d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5eb3ff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#091726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central star shape -->
  <g transform="translate(100, 100)">
    <!-- Outer star (5-pointed) -->
    <path d="M 0,-45 L 13.5,-14.5 L 47,-14.5 L 21,8 L 35,38 L 0,15 L -35,38 L -21,8 L -47,-14.5 L -13.5,-14.5 Z" 
          fill="url(#starGradient)" stroke="none"/>
    
    <!-- Inner accent circle -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#gradientBg)" stroke-width="2" opacity="0.8"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" fill="url(#gradientBg)"/>
  </g>
</svg>
